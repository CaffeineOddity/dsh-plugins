<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>智能体中枢 · 全局设置</title>
<link rel="stylesheet" href="/agent-bot/site.css"/>
<script src="/agent-bot/site.js"></script>
</head>
<body>
<div class="msg" id="msg"></div>
<div class="layout">
  <nav class="sidebar">
  <div class="side-logo"><span class="hex">⬡</span>AgentBot</div>
  <div class="side-status"><span class="dot" id="hub-dot" title="Provider 在线状态"></span><span id="side-dot-txt">Provider 状态</span></div>


    <a class="nav" href="/agent-bot/skills">Skills</a>
    <a class="nav" href="/agent-bot/prompts">Prompts</a>
    <a class="nav" href="/agent-bot/agents">Agents</a>
    <a class="nav" href="/agent-bot/chat">对话</a>
    <a class="nav active" href="/agent-bot/settings">全局设置</a>
    <a class="nav" href="/agent-bot/log">日志</a>
  </nav>
  <main class="content">
    <section>
      <div class="card">
        <h2>全局设置</h2>
        <div class="row">
          <label>配置目录</label>
          <span id="st-configDir">-</span>
        </div>
        <p class="hint">只读。缺省 ~/.dsh/storages/agentbot，可用 env:AGENT_BOT_CONFIG_DIR 覆盖。不在本站配如流 token。</p>
        <div class="row">
          <label>在线 Provider</label>
          <span id="st-providers">-</span>
        </div>
        <div class="row">
          <label>agent 等待超时</label>
          <input id="st-timeout" type="number" min="1000" max="1800000" step="1000" style="width:220px;flex:0 0 auto"/>
          <span class="hint" style="margin:0">毫秒，范围 1000–1800000，默认 180000（3 分钟）</span>
        </div>
        <p class="hint">超时未拿到回复时通道先回「处理中」，后台完成后再补发。保存后下次 ask 立即生效。</p>
        <button type="button" id="st-save" class="primary">保存</button>
      </div>
    </section>
  </main>
</div>
<script>
async function loadSettings() {
  const r = await rpc('settings')
  if (r.ok && r.value) {
    $('st-timeout').value = String(r.value.agent_wait_timeout_ms ?? 180000)
    if (r.value.configDir) setText('st-configDir', r.value.configDir)
    if (Array.isArray(r.value.providers)) {
      setText('st-providers', r.value.providers.length === 0
        ? '无'
        : r.value.providers.map((p) => (p.label || p.id) + ' (' + p.id + ')').join('、'))
    }
  }
}
$('st-save').onclick = async () => {
  const r = await rpc('saveSettings', { agent_wait_timeout_ms: $('st-timeout').value.trim() })
  setMsg(r.ok ? '✅ 已保存超时 ' + ((r.value && r.value.agent_wait_timeout_ms) || '') + ' ms' : '❌ ' + (r.error || '保存失败'), !r.ok)
  if (r.ok) loadSettings()
}
loadSettings()
</script>
</body>
</html>
