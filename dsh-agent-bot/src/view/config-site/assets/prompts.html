<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>智能体中枢 · Prompts</title>
<link rel="stylesheet" href="/agent-bot/site.css"/>
<script src="/agent-bot/site.js"></script>
</head>
<body>
<div class="msg" id="msg"></div>
<div class="layout">
  <nav class="sidebar">
  <div class="side-logo"><span class="hex">⬡</span>AgentBot</div>
  <div class="side-status"><span class="dot" id="hub-dot" title="Provider 在线状态"></span><span id="side-dot-txt">Provider 状态</span></div>


    <a class="nav" href="/agent-bot/skills">Skills</a>
    <a class="nav active" href="/agent-bot/prompts">Prompts</a>
    <a class="nav" href="/agent-bot/agents">Agents</a>
    <a class="nav" href="/agent-bot/chat">对话</a>
    <a class="nav" href="/agent-bot/settings">全局设置</a>
    <a class="nav" href="/agent-bot/log">日志</a>
  </nav>
  <main class="content">
    <section>
      <div class="box">
        <div class="row">
          <b style="font-size:16px">prompt 管理</b>
          <input id="prompt-filter" placeholder="筛选：按名称包含" style="width:220px;flex:0 0 auto"/>
          <span class="grow"></span>
          <button type="button" id="add-preset" class="btn pri">+ 添加 prompt</button>
        </div>
        <div id="preset-list" style="margin-top:8px"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="prompt-modal" style="display:none">
  <div class="modal-box narrow">
    <div class="mtitle" id="prompt-title">添加 prompt / 编辑</div>
    <div class="fld"><label>预设名</label><div class="ctl"><input id="pp-name" placeholder="必填、唯一，如 default"/></div></div>
    <div class="fld"><label>system prompt</label><div class="ctl"><textarea id="pp-prompt" rows="8"></textarea></div></div>
    <div class="note" style="margin-left:100px;margin-top:0">变量：{{sender}} {{session_key}} {{provider_id}} 及 sessionParts 键；不提供 {{webhook_url}}。推荐工具按绑定该预设的智能体技能组自动展开，不在此手填。</div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn" id="pp-cancel">取消</button>
      <button type="button" class="btn pri" id="pp-save">保存</button>
    </div>
  </div>
</div>

<script>
let presets = {}
let shownNames = []
let editPresetKey = null

function presetNames() { return Object.keys(presets).sort() }

function renderPresets() {
  const q = ($('prompt-filter').value || '').trim().toLowerCase()
  shownNames = presetNames().filter((n) => !q || n.toLowerCase().includes(q))
  $('preset-list').innerHTML = (shownNames.map((name, i) => `
    <div class="li">
      <div class="grow"><b>${esc(name)}</b></div>
      <div style="margin-left:auto;white-space:nowrap;text-align:right">
        <button type="button" class="btn" data-pedit="${i}">编辑</button>
        <button type="button" class="btn dgr" data-pdel="${i}">删除</button>
      </div>
    </div>`).join('') || `<div class="statebar">状态：${q ? '筛选无结果' : '空数据 ——「暂无 prompt。点『+ 添加 prompt』创建。」'}</div>`)
}

function openPresetModal(name) {
  editPresetKey = name || null
  $('prompt-title').textContent = name ? '编辑：' + name : '添加 prompt'
  $('pp-name').value = name || ''
  $('pp-prompt').value = (name && presets[name] ? presets[name].system_prompt : '') || ''
  $('prompt-modal').style.display = 'flex'
}

function closePresetModal() { $('prompt-modal').style.display = 'none'; editPresetKey = null }

$('prompt-filter').addEventListener('input', renderPresets)
$('add-preset').onclick = () => openPresetModal(null)
$('pp-cancel').onclick = closePresetModal

$('preset-list').addEventListener('click', async (ev) => {
  const edit = ev.target.closest('[data-pedit]')
  if (edit) { openPresetModal(shownNames[Number(edit.dataset.pedit)]); return }
  const del = ev.target.closest('[data-pdel]')
  if (!del) return
  const name = shownNames[Number(del.dataset.pdel)]
  if (!confirm('确认删除预设「' + name + '」？仍有 agent 引用时会禁止删除。')) return
  const next = { ...presets }
  delete next[name]
  const r = await rpc('savePrompts', { prompts: next })
  setMsg(r.ok ? '✅ 已删除' : '❌ ' + (r.error || '删除失败'), !r.ok)
  if (r.ok) loadPrompts()
})

$('pp-save').onclick = async () => {
  const name = $('pp-name').value.trim()
  if (!name) { setMsg('⚠️ 预设名必填', true); return }
  const next = { ...presets }
  if (editPresetKey !== null && editPresetKey !== name) delete next[editPresetKey]
  next[name] = { system_prompt: $('pp-prompt').value, tools: [] }
  const r = await rpc('savePrompts', { prompts: next })
  setMsg(r.ok ? '✅ 已保存' : '❌ ' + (r.error || '保存失败'), !r.ok)
  if (r.ok) { closePresetModal(); loadPrompts() }
}

async function loadPrompts() {
  const r = await rpc('listPrompts', { query: '' })
  if (!r.ok || !r.value) { setMsg('❌ ' + (r.error || '加载失败'), true); return }
  const items = Array.isArray(r.value) ? r.value : (r.value.prompts || [])
  presets = {}
  for (const item of items) {
    presets[item.name] = { system_prompt: item.system_prompt || '', tools: item.tools || [] }
  }
  renderPresets()
}

loadPrompts()
</script>
</body>
</html>
