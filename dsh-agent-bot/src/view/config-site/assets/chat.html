<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>智能体中枢 · 对话</title>
<link rel="stylesheet" href="/agent-bot/site.css"/>
<script src="/agent-bot/site.js"></script>
<style>
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:4px 4px 8px}
.bubble{padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-width:100%}
.bubble.user{background:#eef2ff;align-self:flex-end}
.bubble.assistant{background:#f6f8fa;border:1px solid #e2e4e8;align-self:flex-start}
.bubble.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.bubble .role{font-size:11px;color:#888;margin-bottom:4px}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.composer textarea{flex:1;min-height:48px;max-height:200px}
.composer button{margin:0;flex:0 0 auto}
</style>
</head>
<body>
<div class="msg" id="msg"></div>
<div class="layout">
  <nav class="sidebar">
  <div class="side-logo"><span class="hex">⬡</span>AgentBot</div>
  <div class="side-status"><span class="dot" id="hub-dot" title="Provider 在线状态"></span><span id="side-dot-txt">Provider 状态</span></div>


    <a class="nav" href="/agent-bot/skills">Skills</a>
    <a class="nav" href="/agent-bot/prompts">Prompts</a>
    <a class="nav" href="/agent-bot/agents">Agents</a>
    <a class="nav active" href="/agent-bot/chat">对话</a>
    <a class="nav" href="/agent-bot/settings">全局设置</a>
    <a class="nav" href="/agent-bot/log">日志</a>
  </nav>
  <main class="content">
    <div class="card">
      <div class="row">
        <label>智能体</label>
        <select id="agent-select" class="grow"></select>
      </div>
      <div id="agent-empty" class="hint" style="display:none">先去 <a href="/agent-bot/agents">Agents</a> 页建一个智能体。</div>
    </div>
    <div class="card">
      <div class="chat-box" id="chat-box"></div>
      <div class="composer">
        <textarea id="input" placeholder="输入消息，回车发送（Shift+回车换行）…"></textarea>
        <button type="button" id="send" class="primary">发送</button>
      </div>
    </div>
  </main>
</div>
<script>
let agents = []
let sending = false

function pageSession() {
  let id = localStorage.getItem('agentbot-chat-session')
  if (!id) {
    id = 'chat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
    localStorage.setItem('agentbot-chat-session', id)
  }
  return id
}

function bubble(role, text, isErr) {
  const el = document.createElement('div')
  el.className = 'bubble ' + (isErr ? 'err' : role)
  const r = document.createElement('div')
  r.className = 'role'
  r.textContent = role === 'user' ? '我' : (isErr ? '错误' : '智能体')
  const t = document.createElement('div')
  t.textContent = text
  el.appendChild(r)
  el.appendChild(t)
  $('chat-box').appendChild(el)
  $('chat-box').scrollTop = $('chat-box').scrollHeight
}

async function loadAgents() {
  const r = await rpc('listAgents')
  if (!r.ok || !r.value) { setMsg('❌ ' + (r.error || '加载失败'), true); return }
  agents = Array.isArray(r.value) ? r.value : []
  const sel = $('agent-select')
  if (!agents.length) {
    sel.innerHTML = ''
    $('agent-empty').style.display = ''
    $('send').disabled = true
    return
  }
  $('agent-empty').style.display = 'none'
  $('send').disabled = false
  sel.innerHTML = agents.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}${a.description ? ' — ' + esc(a.description) : ''}</option>`).join('')
  // 预选：?agent=<id>（/agent 斜杠命令跳来时指定）
  const pre = new URLSearchParams(location.search).get('agent')
  if (pre && agents.some((a) => a.id === pre)) sel.value = pre
}

function renderMessages(list) {
  for (const m of list) {
    const text = m.text || ''
    if (text) bubble('assistant', text)
  }
  if (!list.length) bubble('assistant', '本轮没有生成内容')
}

async function send() {
  if (sending) return
  const agentId = $('agent-select').value
  if (!agentId) { setMsg('⚠️ 请先选择智能体', true); return }
  const input = $('input')
  const text = input.value.trim()
  if (!text) return
  sending = true
  $('send').disabled = true
  input.value = ''
  bubble('user', text)
  try {
    const r = await rpc('ask', { agentId, context: text, sessionKey: pageSession() })
    if (!r.ok || !r.value) { bubble('assistant', r.error || '请求失败', true); return }
    renderMessages(r.value.messages || [])
  } catch (err) {
    bubble('assistant', err instanceof Error ? err.message : String(err), true)
  } finally {
    sending = false
    $('send').disabled = !agents.length
  }
}

$('send').onclick = send
$('input').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); send() }
})

/**
 * 轮询本地收件箱：patrol 的异步消息（待决问卷 / 进度 / 到点提醒 / 等审批通知）
 * 没法主动推到网页，按对话存在服务端，这里定期取走并追加到对话里。
 */
async function pollInbox() {
  try {
    const r = await rpc('inbox', { sessionKey: pageSession() })
    if (!r.ok || !r.value) return
    const list = Array.isArray(r.value.messages) ? r.value.messages : []
    for (const m of list) {
      const text = m.text || ''
      if (text) bubble('assistant', text)
    }
  } catch {
    // 轮询失败不打扰用户：下一轮再试
  }
}

loadAgents()
refreshStatus()
pollInbox()
setInterval(pollInbox, 4000)
</script>
</body>
</html>
