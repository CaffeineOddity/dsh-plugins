<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cron-loop 任务中心</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4d9fff;
    --ok: #3fb96f; --err: #e5534b; --run: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; cursor: pointer; }
  header .spacer { flex: 1; }
  header button { background: var(--accent); border: 0; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }
  section { margin-bottom: 26px; }
  h2 { font-size: 15px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: rgba(255,255,255,0.02); }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .pill.ok { background: rgba(63,185,111,.15); color: var(--ok); }
  .pill.error { background: rgba(229,83,75,.15); color: var(--err); }
  .pill.running { background: rgba(210,153,34,.15); color: var(--run); }
  .pill.off { background: rgba(139,147,163,.15); color: var(--muted); }
  .cwd { color: var(--muted); font-size: 12px; }
  .actions button { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 3px 8px; margin-right: 5px; cursor: pointer; font-size: 12px; }
  .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .actions button.danger:hover { border-color: var(--err); color: var(--err); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 20px; width: 460px; max-width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 14px; font-size: 15px; }
  dialog label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
  dialog input, dialog textarea, dialog select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 9px; font: inherit; }
  dialog textarea { min-height: 72px; resize: vertical; }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  dialog .row button { padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
  dialog .row button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dialog .checkbox-row { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; color: var(--text); font-size: 13px; cursor: pointer; }
  dialog .checkbox-row input { width: auto; margin: 0; }
  .empty { color: var(--muted); padding: 26px; text-align: center; background: var(--panel); border: 1px dashed var(--border); border-radius: 8px; }
  .err-text { color: var(--err); font-size: 12px; max-width: 340px; overflow-wrap: anywhere; }
  .summary { color: var(--muted); font-size: 12px; max-width: 380px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  a { color: var(--accent); text-decoration: none; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  /* 项目列表 */
  .proj-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s; }
  .proj-card:hover { border-color: var(--accent); }
  .proj-card .proj-name { font-size: 15px; font-weight: 600; }
  .proj-card .proj-path { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .proj-card .proj-stats { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .proj-card .proj-stats span { display: flex; align-items: center; gap: 4px; }
  /* 标签页 */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab { padding: 8px 20px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 14px; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }
  /* 面包屑 */
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .crumb a { cursor: pointer; }
  .crumb .sep { margin: 0 6px; }
  .crumb .cur { color: var(--text); }
  /* 执行历史工具条 */
  .runs-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .runs-toolbar button { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .runs-toolbar button.danger:hover { border-color: var(--err); color: var(--err); }
</style>
</head>
<body>
<header>
  <h1 id="logo">⏰ cron-loop 任务中心</h1>
  <span class="cwd" id="headInfo"></span>
  <div class="spacer"></div>
  <button id="btnPool">模型池</button>
  <button id="btnNew">＋ 新建任务</button>
</header>
<main id="app">
</main>

<dialog id="dlg">
  <h3 id="dlgTitle">新建任务</h3>
  <label>任务名称（可选）</label>
  <input id="fName" placeholder="留空自动取 prompt 前 24 字">
  <label>项目目录（cwd，绝对路径）</label>
  <input id="fCwd" placeholder="/Users/you/projects/demo">
  <label>cron 表达式（5 段：分 时 日 月 周）</label>
  <input id="fCron" placeholder="0 9 * * 1-5">
  <label>任务 prompt（到期后注入会话执行）</label>
  <textarea id="fPrompt" placeholder="总结本项目昨天的 git 提交，输出要点列表"></textarea>
  <label>权限模式</label>
  <select id="fPerm">
    <option value="danger-full-access">完全权限（无人值守推荐）</option>
    <option value="workspace-write">工作区内修改</option>
    <option value="read-only">仅可查看</option>
  </select>
  <label class="checkbox-row"><input type="checkbox" id="fContinuous"> 连续执行（成功后立即续跑下一轮，不等 cron 触发）</label>
  <div class="row">
    <button id="btnCancel">取消</button>
    <button id="btnSave" class="primary">保存</button>
  </div>
</dialog>

<dialog id="poolDlg">
  <h3>模型池配置</h3>
  <label class="checkbox-row"><input type="checkbox" id="poolEnabled"> 启用模型池（关闭时用 DSH 默认模型）</label>
  <label>模型列表（JSON 数组）</label>
  <textarea id="poolModels" style="min-height:200px;font-family:monospace;font-size:12px" placeholder='[{"id":"volcengine-135","provider":"volcengine","model":"ark-code-latest","priority":1,"quotaReset":{"type":"hours","value":24}}]'></textarea>
  <div style="margin-top:8px">
    <span class="cwd">字段：id（唯一标识）、provider、model、priority（越小越优先）、quotaReset.type（hours/daily/weekly/monthly）、quotaReset.value（hours 模式的小时数）</span>
  </div>
  <div class="row">
    <button id="poolCancel">取消</button>
    <button id="poolSave" class="primary">保存</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
let editingId = null
let allJobs = []
let allRuns = []
let currentCwd = null  // null = 项目列表视图; 否则 = 项目详情视图
let currentTab = 'crons'  // 'crons' | 'runs'

function toast(text) {
  const t = $('toast')
  t.textContent = text
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2200)
}

async function api(path, options) {
  const res = await fetch(path, options)
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
  return data
}

const STATUS_PILL = { ok: 'ok', error: 'error', running: 'running' }
const PERM_LABEL = { 'read-only': '仅可查看', 'workspace-write': '工作区内修改', 'danger-full-access': '完全权限' }

function esc(text) {
  return String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

function basename(path) {
  return path.split('/').filter(Boolean).pop() || path
}

/** 按项目目录分组 */
function groupByProject(jobs) {
  const map = new Map()
  for (const job of jobs) {
    if (!map.has(job.cwd)) map.set(job.cwd, [])
    map.get(job.cwd).push(job)
  }
  return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]))
}

/** 渲染项目列表视图 */
function renderProjectList() {
  const groups = groupByProject(allJobs)
  if (groups.length === 0) {
    $('app').innerHTML = '<section><div class="empty">暂无任务。点右上角「新建任务」，或在任意会话里用 /cron 命令创建。</div></section>'
    return
  }
  const cards = groups.map(([cwd, jobs]) => {
    const runs = allRuns.filter((r) => jobs.some((j) => j.id === r.jobId))
    const enabled = jobs.filter((j) => j.enabled).length
    const lastRun = runs.length > 0 ? new Date(runs[0].startedAt).toLocaleString() : '无'
    return `<div class="proj-card" data-cwd="${esc(cwd)}">
      <div class="proj-name">${esc(basename(cwd))}</div>
      <div class="proj-path">${esc(cwd)}</div>
      <div class="proj-stats">
        <span>📋 ${jobs.length} 个任务（${enabled} 启用）</span>
        <span>📊 ${runs.length} 条历史</span>
        <span>🕐 上次: ${esc(lastRun)}</span>
      </div>
    </div>`
  })
  $('app').innerHTML = `<section><h2>项目列表</h2>${cards.join('')}</section>`
  // 绑定点击进入项目详情
  $('app').querySelectorAll('.proj-card').forEach((card) => {
    card.addEventListener('click', () => {
      currentCwd = card.dataset.cwd
      currentTab = 'crons'
      renderDetail()
    })
  })
}

/** 渲染项目详情视图（含两个 tab） */
function renderDetail() {
  const cwd = currentCwd
  const projJobs = allJobs.filter((j) => j.cwd === cwd)
  const projRuns = allRuns.filter((r) => projJobs.some((j) => j.id === r.jobId))
  const projName = basename(cwd)
  const crumb = `<div class="crumb"><a id="crumbHome">⏰ 全部项目</a><span class="sep">/</span><span class="cur">${esc(projName)}</span></div>`
  const tabs = `<div class="tabs">
    <div class="tab ${currentTab === 'crons' ? 'active' : ''}" data-tab="crons">定时任务 (${projJobs.length})</div>
    <div class="tab ${currentTab === 'runs' ? 'active' : ''}" data-tab="runs">最近执行历史 (${projRuns.length})</div>
  </div>`

  let content = ''
  if (currentTab === 'crons') {
    content = renderJobsTable(projJobs)
  } else {
    content = renderRunsTable(projRuns)
  }

  $('app').innerHTML = crumb + tabs + `<section><div id="tabContent">${content}</div></section>`

  // 面包屑回首页
  $('crumbHome').addEventListener('click', () => { currentCwd = null; renderProjectList() })
  // tab 切换
  $('app').querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => { currentTab = tab.dataset.tab; renderDetail() })
  })
  // 绑定操作按钮
  bindActions()
}

/** 渲染任务表格 HTML */
function renderJobsTable(jobs) {
  if (!jobs.length) {
    return '<div class="empty">该项目暂无任务。点右上角「新建任务」创建。</div>'
  }
  const rows = jobs.map((job) => {
    const status = job.enabled
      ? (job.lastStatus ? `<span class="pill ${STATUS_PILL[job.lastStatus] || 'off'}">${job.lastStatus}</span>` : '<span class="pill off">待触发</span>')
      : '<span class="pill off">已暂停</span>'
    const next = job.nextRunAtView ? new Date(job.nextRunAtView).toLocaleString() : '-'
    const last = job.lastRunAt ? new Date(job.lastRunAt).toLocaleString() : '-'
    return `<tr data-id="${job.id}">
      <td><b>${esc(job.id)}</b><br><span class="cwd">${esc(job.name)}</span></td>
      <td>${status}</td>
      <td><b>${esc(job.cronHuman || job.cron)}</b><br><code>${esc(job.cron)}</code></td>
      <td>${esc(next)}<br><span class="cwd">上次: ${esc(last)}</span></td>
      <td class="cwd">${esc(PERM_LABEL[job.permissionMode] || job.permissionMode || '完全权限')}${job.continuous ? '<br>🔄 连续执行' : ''}</td>
      <td class="summary" title="${esc(job.prompt)}">${esc(job.prompt)}</td>
      <td class="actions">
        <button data-act="edit">编辑</button>
        <button data-act="toggle">${job.enabled ? '暂停' : '恢复'}</button>
        <button data-act="trigger">立即跑</button>
        <button data-act="remove" class="danger">删除</button>
      </td>
    </tr>`
  })
  return `<table>
    <thead><tr><th>任务</th><th>状态</th><th>cron</th><th>下次触发</th><th>权限</th><th>prompt</th><th>操作</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table>`
}

/** 渲染执行历史表格 HTML */
function renderRunsTable(runs) {
  if (!runs.length) {
    return '<div class="empty">暂无执行历史</div>'
  }
  const rows = runs.map((run) => {
    const at = new Date(run.startedAt).toLocaleString()
    const dur = run.finishedAt ? Math.round((run.finishedAt - run.startedAt) / 1000) + 's' : '…'
    const detail = run.error !== undefined
      ? `<div class="err-text">${esc(run.error)}</div>`
      : `<div class="summary" title="${esc(run.summary || '')}">${esc(run.summary || '')}</div>`
    const session = run.sessionId ? `<a href="/?session=${encodeURIComponent(run.sessionId)}">${esc(run.sessionId.slice(0, 12))}…</a>` : ''
    return `<tr data-runid="${esc(run.id)}">
      <td>${esc(at)}<br><span class="cwd">${esc(dur)}</span></td>
      <td><span class="pill ${STATUS_PILL[run.status] || 'off'}">${run.status}</span></td>
      <td><b>${esc(run.jobName)}</b><br><span class="cwd">${esc(run.jobId)}</span></td>
      <td>${detail}</td>
      <td>${session}</td>
      <td class="actions"><button data-runact="del" class="danger">删除</button></td>
    </tr>`
  })
  return `<div class="runs-toolbar"><span class="cwd">${runs.length} 条记录</span><div class="spacer" style="flex:1"></div><button data-runact="clearall" class="danger">清空所有执行记录</button></div>
  <table>
    <thead><tr><th>时间 / 耗时</th><th>状态</th><th>任务</th><th>结果</th><th>会话</th><th>操作</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table>`
}

/** 绑定任务操作和运行历史操作 */
function bindActions() {
  const content = $('tabContent')
  if (content === null) return
  // 任务操作
  content.querySelectorAll('button[data-act]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.closest('tr').dataset.id
      const act = btn.dataset.act
      if (act === 'edit') {
        const job = allJobs.find((j) => j.id === id)
        if (job !== undefined) openDialog(job)
        return
      }
      if (act === 'toggle') {
        const job = allJobs.find((j) => j.id === id)
        if (job === undefined) return
        api('/cron/api/jobs/' + id, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled: !job.enabled }) })
          .then(() => { toast(job.enabled ? '已暂停' : '已恢复'); refresh() })
          .catch((error) => toast(error.message))
        return
      }
      if (act === 'trigger') {
        api('/cron/api/jobs/' + id + '/trigger', { method: 'POST' })
          .then(() => { toast('已触发，稍后刷新查看结果'); setTimeout(refresh, 3000) })
          .catch((error) => toast(error.message))
        return
      }
      if (act === 'remove') {
        if (!confirm('删除任务 ' + id + ' 及其全部历史？')) return
        api('/cron/api/jobs/' + id, { method: 'DELETE' })
          .then(() => { toast('已删除'); refresh() })
          .catch((error) => toast(error.message))
      }
    })
  })
  // 运行历史删除 + 清空全部
  content.querySelectorAll('button[data-runact]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.runact
      if (act === 'del') {
        const runId = btn.closest('tr').dataset.runid
        if (!confirm('删除这条历史记录？')) return
        api('/cron/api/runs/' + encodeURIComponent(runId), { method: 'DELETE' })
          .then(() => { toast('已删除'); refresh() })
          .catch((error) => toast('删除失败: ' + error.message))
      }
      if (act === 'clearall') {
        if (!confirm('清空本项目的全部执行记录？')) return
        // 按项目内每个 job 清空（后端支持 ?jobId= 限定单个任务）
        const projJobs = allJobs.filter((j) => j.cwd === currentCwd)
        Promise.all(projJobs.map((j) => api('/cron/api/runs?jobId=' + encodeURIComponent(j.id), { method: 'DELETE' })))
          .then(() => { toast('已清空'); refresh() })
          .catch((error) => toast('清空失败: ' + error.message))
      }
    })
  })
}

async function refresh() {
  try {
    const [jobsData, runsData] = await Promise.all([api('/cron/api/jobs'), api('/cron/api/runs?limit=200')])
    allJobs = jobsData.jobs
    allRuns = runsData.runs
    $('headInfo').textContent = `${allJobs.length} 个任务`
    if (currentCwd === null) {
      renderProjectList()
    } else {
      // 如果当前选中的项目已不存在，回到列表
      if (!allJobs.some((j) => j.cwd === currentCwd)) {
        currentCwd = null
        renderProjectList()
      } else {
        renderDetail()
      }
    }
  } catch (error) {
    $('app').innerHTML = `<section><div class="empty">加载失败: ${esc(error.message)}</div></section>`
  }
}

function openDialog(job) {
  editingId = job ? job.id : null
  $('dlgTitle').textContent = job ? `编辑 ${job.id}` : '新建任务'
  $('fName').value = job ? job.name : ''
  $('fCwd').value = job ? job.cwd : (currentCwd || '')
  $('fCron').value = job ? job.cron : ''
  $('fPrompt').value = job ? job.prompt : ''
  $('fPerm').value = job?.permissionMode || 'danger-full-access'
  $('fContinuous').checked = job?.continuous || false
  $('dlg').showModal()
}

$('logo').addEventListener('click', () => { currentCwd = null; renderProjectList() })
$('btnNew').addEventListener('click', () => openDialog(null))
$('btnCancel').addEventListener('click', () => $('dlg').close())
$('btnSave').addEventListener('click', () => {
  const body = {
    name: $('fName').value.trim() || undefined,
    cwd: $('fCwd').value.trim(),
    cron: $('fCron').value.trim(),
    prompt: $('fPrompt').value.trim(),
    permissionMode: $('fPerm').value,
    continuous: $('fContinuous').checked,
  }
  const req = editingId === null
    ? api('/cron/api/jobs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    : api('/cron/api/jobs/' + editingId, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  req.then(() => { $('dlg').close(); toast('已保存'); refresh() })
     .catch((error) => toast('保存失败: ' + error.message))
})

// 模型池管理
$('btnPool').addEventListener('click', () => {
  api('/cron/api/model-pool').then((data) => {
    $('poolEnabled').checked = data.enabled === true
    $('poolModels').value = JSON.stringify(data.models ?? [], null, 2)
    $('poolDlg').showModal()
  }).catch((error) => toast('读取失败: ' + error.message))
})
$('poolCancel').addEventListener('click', () => $('poolDlg').close())
$('poolSave').addEventListener('click', () => {
  let models
  try { models = JSON.parse($('poolModels').value) } catch (e) { toast('JSON 格式错误: ' + e.message); return }
  api('/cron/api/model-pool', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled: $('poolEnabled').checked, models }) })
    .then(() => { $('poolDlg').close(); toast('模型池已保存') })
    .catch((error) => toast('保存失败: ' + error.message))
})

refresh()
setInterval(refresh, 15000)
</script>
</body>
</html>
