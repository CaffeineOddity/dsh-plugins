# dsh-cron-loop 的 Cordis 叠加层（bundle layer）
# 经 `dsh plugin --profile web add <本目录>` 安装后，dsh 读取 profile node_modules 软链
# 指向的本文件并应用。name 相对本文件所在目录（即 bundle 根目录）解析，
# 因此 ./plugins/... 与机器路径无关，无需手工改路径。

- insert:
    - id: cron-store
      name: ./plugins/cron-store.ts
    - id: cron-scheduler
      name: ./plugins/cron-scheduler.ts
    - id: cron-web
      name: ./plugins/cron-web.ts
    - id: cron-commands
      name: ./plugins/cron-commands.ts
